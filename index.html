<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Meu Controle Financeiro</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#2855D9"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meu Controle"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#F6F8FB;--sf:#fff;--tx:#172033;--t2:#667085;--pr:#2855D9;--ok:#16845B;--wn:#B7791F;--er:#C24141;--bd:#E4E7EC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1420;--sf:#172033;--tx:#eef2f9;--t2:#9aa6bb;--pr:#7aa0ff;--ok:#3cc08f;--wn:#e0a94a;--er:#ef7b7b;--bd:#2a3550}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:760px;margin:0 auto;padding:12px 14px}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:1.05rem;margin:0}h2{font-size:1rem;margin:0 0 8px}p{margin:4px 0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(23,32,51,.06)}
.hero{background:linear-gradient(135deg,#2855D9,#1d3fa8);color:#fff;border:0}.hero .m{color:#dbe5ff}
.big{font-size:2rem;font-weight:700;letter-spacing:-.02em}.m{color:var(--t2);font-size:.88rem}
.bar{height:12px;border-radius:8px;background:rgba(127,140,170,.25);overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--ok)}.hero .bar i{background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tx{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}.tx:first-child{border-top:0}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;margin:2px 4px 0 0;color:var(--t2)}
.warn{border-left:4px solid var(--wn)}.neg{color:var(--er)}.pos{color:var(--ok)}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);padding:0 14px;cursor:pointer}
button.p{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:600}button.s{min-height:36px;padding:0 10px;font-size:.85rem}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--bd);border-radius:12px;padding:8px 10px;background:var(--bg);margin:3px 0 8px}
label{font-size:.85rem;color:var(--t2)}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;flex:1;min-width:0;padding:0 2px;font-size:.74rem;color:var(--t2);min-height:48px}nav button.on{color:var(--pr);font-weight:700}
nav .plus{flex:0 0 56px;height:56px;border-radius:50%;background:var(--pr);color:#fff;font-size:1.8rem;margin-top:-22px;padding:0}
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--sf);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px calc(16px) calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:30;display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:auto}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;min-height:32px}
.mn{display:inline-block}.mn::first-letter{text-transform:uppercase}
.cb{display:flex;align-items:center;gap:8px;font-size:.88rem;margin:6px 0}.cb b{min-width:110px;font-weight:500}.cb .bar{flex:1;margin:0}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="ov"></div>
<script>
const K='mcf_v1',TZ='America/Sao_Paulo';
const MT={d:'Débito',p:'Pix',c:'Crédito',m:'Dinheiro',b:'Boleto',t:'Transferência',o:'Outro'};
const CATS=['Alimentação / Restaurante','Alimentação / Sorvete e sobremesa','Alimentação / Delivery','Mercado / Supermercado','Compras / Marketplace','Cuidados pessoais / Perfumaria','Transporte / Aplicativo','Transporte público','Combustível','Moradia','Contas da casa','Saúde','Farmácia','Roupas','Lazer','Educação','Assinaturas','Presentes','Outros','Não categorizado'];
const IVC=['Reserva fim de ano','Reserva dias especiais','Investimento','Outra reserva'],ACC=['','BTG','Nubank','Mercado Pago','Banco Inter','Dinheiro'];
const ICAT=['Salário','Abono','VR / VA','Reembolso','Venda de item','Compra e revenda','Comissão','Renda extra','Rendimentos','Outras receitas'];

const QUICK=[['Gastos do dia a dia',[['Mercado','exp','var','Nubank','d','Mercado / Supermercado'],['Transporte (Uber)','exp','var','Nubank','d','Transporte / Aplicativo'],['Delivery (iFood)','exp','var','Nubank','d','Alimentação / Delivery'],['Farmácia','exp','var','Nubank','d','Farmácia'],['Conta de luz','exp','var','Nubank','d','Contas da casa'],['Conta de água','exp','var','Nubank','d','Contas da casa']]],['Receitas',[['Salário','inc','','','t','Salário'],['Abono','inc','','','t','Abono'],['VR','inc','','','t','VR / VA'],['VA','inc','','','t','VR / VA'],['Compra e revenda','inc','','','t','Compra e revenda']]]];
const qk=(g,i)=>{const q=QUICK[g][1][i];openForm(null,q[1],Object.assign({desc:q[0],type:q[1],kind:q[2]||'var',acc:q[1]=='exp'&&q[3]?'Nubank':'',method:q[4]||'d'},q[5]?{cat:q[5]}:{}))};
const quick=()=>`<details class="card"><summary><b>Lançamento rápido</b></summary><p class="m">Toque para lançar. Escolha um item e informe o valor. Faturas de cartão (Nubank, Mercado Pago) não entram aqui: lance as compras uma a uma, pois pagar a fatura não é uma nova despesa.</p>${QUICK.map((g,gi)=>`<p><b>${g[0]}</b></p>${g[1].map((q,i)=>`<button class="s" style="margin:0 6px 6px 0" onclick="qk(${gi},${i})">${q[0]}</button>`).join('')}`).join('')}</details>`;
const opt=(l,v)=>l.map(a=>`<option ${v==a?'selected':''}>${a}</option>`).join('');
const mig=()=>{S.accts=S.accts||[{n:'Nubank',o:null,r:null,at:null}];S.cards=S.cards||[];S.fixed=S.fixed||[];S.lim=S.lim||{};S.metas=S.metas||{};S.goals=S.goals||[];if(!S.v3){S.v3=1;S.fixed=S.fixed.filter(f=>!(OLDFX.includes(f.n)&&(!f.c||f.c==14454)))}if(!S.v2){S.v2=1;S.accts=S.accts.filter(a=>a.n=='Nubank'||a.o!=null||a.r!=null);if(!S.accts.some(a=>a.n=='Nubank'))S.accts.unshift({n:'Nubank',o:null,r:null,at:null});if(!S.cards.length)S.cards.push({n:'Mercado Pago',l:null,f:'',v:''});if(!S.fixed.length)S.fixed=FX.map(x=>({...x}));save()}};
const calc=a=>{let c=a.o||0;S.tx.forEach(t=>{if(t.status!='pago')return;if(t.acc==a.n){if(t.type=='inc')c+=t.cents;else if(t.type=='inv'||t.type=='tr')c-=t.cents;else if(t.type=='exp'&&t.method!='c'&&t.kind!='obj')c-=t.cents}if(t.dest==a.n){if(t.type=='tr')c+=t.cents;if(t.type=='fat')c-=t.cents}});return c};
const fatura=c=>S.tx.filter(t=>t.acc==c.n&&t.method=='c'&&t.type=='exp').reduce((s,t)=>s+t.cents,0)-S.tx.filter(t=>t.type=='fat'&&t.acc==c.n).reduce((s,t)=>s+t.cents,0);
const fmtIn=v=>v==null?'':(v/100).toFixed(2).replace('.',',');
const setA=(i,k,v)=>{S.accts[i][k]=parse(v);if(k=='r')S.accts[i].at=today();save();draw()};
const acctH=()=>`<div class='card'><h2>Contas e saldos</h2><p class='m'>Informe o saldo de abertura (marco zero) e o saldo real do app do banco. O saldo calculado soma só lançamentos pagos com conta escolhida. Compras no crédito só saem da conta quando você paga a fatura.</p>${S.accts.map((a,i)=>{const c=calc(a),d=a.r==null?null:a.r-c;return`<div class='tx' style='display:block'><b>${a.n}</b><div class='grid'><div><label>Abertura</label><input inputmode='decimal' value='${fmtIn(a.o)}' onchange='setA(${i},"o",this.value)'></div><div><label>Real hoje</label><input inputmode='decimal' value='${fmtIn(a.r)}' onchange='setA(${i},"r",this.value)'></div></div><div class='m'>Calculado: ${R(c)} · ${d==null?'informe o saldo real para comparar':'Diferença: '+R(d)+(d?'. Possíveis causas: lançamento esquecido, receita não registrada, duplicidade, fatura contada duas vezes, taxa ou valor errado.':' — confere')}${a.at?' · conferido em '+a.at.split('-').reverse().join('/'):''}</div></div>`}).join('')}<p class='m'>Lançamentos sem conta (não entram nos saldos): ${S.tx.filter(t=>!t.acc).length}</p></div>`;
const addC=()=>{const n=$('#cn').value.trim();if(!n)return;S.cards.push({n,l:parse($('#cl').value),f:$('#cf').value,v:$('#cv').value});save();draw()};
const cardH=()=>`<div class='card'><h2>Cartões de crédito</h2>${S.cards.map((c,i)=>`<div class='tx'><div><b>${esc(c.n)}</b><div class='m'>Limite ${c.l==null?'não informado':R(c.l)} · fecha dia ${esc(c.f)||'?'} · vence dia ${esc(c.v)||'?'}</div></div><div style='text-align:right'><b>${R(fatura(c))}</b><div class='m'>fatura em aberto</div><button class='s' onclick='S.cards.splice(${i},1);save();draw()'>Remover</button></div></div>`).join('')||"<p class='m'>Nenhum cartão cadastrado.</p>"}<div class='grid'><input id='cn' placeholder='Nome (ex.: Nubank)'><input id='cl' inputmode='decimal' placeholder='Limite'><input id='cf' inputmode='numeric' placeholder='Dia de fechamento'><input id='cv' inputmode='numeric' placeholder='Dia de vencimento'></div><button class='p' onclick='addC()'>Cadastrar cartão</button><p class='m'>Ao lançar uma compra no crédito, escolha o cartão em “Conta / banco”. Para quitar, use o tipo “Pagamento de fatura”: não conta como nova despesa. Compras no crédito sem cartão: ${R(S.tx.filter(t=>t.method=='c'&&t.type=='exp'&&!t.acc).reduce((s,t)=>s+t.cents,0))}.</p></div>`;
const fixPay=i=>{const f=S.fixed[i];openForm(null,'exp',{desc:f.n,cents:f.c,kind:'fix',acc:f.a})};
const addF=()=>{const n=$('#fn').value.trim(),c=parse($('#fc').value);if(!n||c==null)return;S.fixed.push({n,c,d:$('#fd').value,a:$('#fa').value});save();draw()};
const fixH=()=>{const s=stats(),paid=n=>s.ef.some(t=>t.desc==n);return`<div class='card'><h2>Gastos fixos e recorrentes</h2>${S.fixed.map((f,i)=>`<div class='tx'><div><b>${esc(f.n)}</b><div class='m'>${f.c?R(f.c):'valor não informado'} · vence dia ${esc(f.d)||'?'} · ${paid(f.n)?'pago neste mês':'a pagar'}</div></div><div><button class='s' onclick='fixPay(${i})'>Lançar pagamento</button> <button class='s' onclick='S.fixed.splice(${i},1);save();draw()'>Remover</button></div></div>`).join('')||"<p class='m'>Nenhum gasto fixo cadastrado.</p>"}<div class='grid'><input id='fn' placeholder='Nome'><input id='fc' inputmode='decimal' placeholder='Valor previsto'><input id='fd' inputmode='numeric' placeholder='Dia do vencimento'><select id='fa'>${opt(['',...S.accts.map(a=>a.n)],'')}</select></div><button class='p' onclick='addF()'>Adicionar gasto fixo</button><p class='m'>A pagar neste mês: ${R(S.fixed.filter(f=>!paid(f.n)).reduce((a,f)=>a+f.c,0))}. Valor previsto não reduz o saldo até ser pago.</p></div>`};
const resH=()=>`<div class='card'><h2>Reservas e investimentos</h2>${IVC.map(c=>`<div class='row'><span>${c}</span><b>${(v=>R(v)+(S.metas[c]?' de '+R(S.metas[c])+' ('+pc(Math.min(100,v/S.metas[c]*100))+')':''))(S.tx.filter(t=>t.type=='inv'&&t.cat==c).reduce((s,t)=>s+t.cents,0))}</b></div>`).join('')}<div class='grid'><select id='mc'>${opt(IVC,'')}</select><input id='mv' inputmode='decimal' placeholder='Meta (R$)'></div><button class='s' onclick='setM()'>Definir meta</button><p class='m'>Soma dos aportes que você lançou, não o saldo real da aplicação. Aportes não contam como consumo.</p></div>`;
const resale=()=>{const c=parse($('#rc').value),v=parse($('#rv').value),t=parse($('#rt').value)||0;if(c==null||v==null){$('#rr').textContent='Informe o custo e o valor recebido.';return}const b={method:'p',status:'pago',date:today(),acc:$('#ra').value,created:new Date().toISOString(),sugg:false,time:'',obs:'Compra e revenda',cat:'Compra e revenda'},k=Date.now();S.tx.push({...b,id:'r'+k,type:'exp',kind:'rev',desc:'Compra para revenda',cents:c},{...b,id:'v'+k,type:'inc',desc:'Venda (revenda)',cents:v});if(t)S.tx.push({...b,id:'f'+k,type:'exp',kind:'rev',desc:'Taxas da revenda',cents:t});S.rev=false;save();flash('Lucro da operação: '+R(v-c-t));draw()};
const resaleH=()=>`<div class='card'><h2>Compra e revenda</h2><div class='grid'><input id='rc' inputmode='decimal' placeholder='Custo de compra'><input id='rv' inputmode='decimal' placeholder='Valor recebido'><input id='rt' inputmode='decimal' placeholder='Taxas (opcional)'><select id='ra'>${opt(['',...S.accts.map(a=>a.n)],'')}</select></div><button class='p' onclick='resale()'>Registrar operação</button><p class='m' id='rr'>Registra o custo (saída) e o recebimento (entrada) separados. Lucro = recebido − custo − taxas. Não entra no orçamento de gastos variáveis.</p></div>`;
const tipH=()=>`<div class='card'><h2>Como usar em 3 passos</h2><p>1. Gastou? Toque no + e digite o valor e o nome.</p><p>2. O card azul mostra quanto ainda resta do seu orçamento.</p><p>3. Em “Mais”, defina o orçamento do mês e o saldo do seu banco.</p><button class='s' onclick='S.tipDone=1;save();draw()'>Entendi, ocultar</button></div>`;
const autoC=v=>{const m=S.tx.slice().reverse().find(t=>t.desc.toLowerCase()==v.trim().toLowerCase()&&t.cat&&t.cat!='Não categorizado'&&t.type=='exp');if(m){if([...$('#f_c').options].some(o=>o.text==m.cat))$('#f_c').value=m.cat;$('#f_m').value=m.method}};
const dup=id=>{const t=S.tx.find(x=>x.id==id);openForm(null,t.type,{desc:t.desc,cents:t.cents,type:t.type,kind:t.kind||'var',cat:t.cat,method:t.method,acc:t.acc,dest:t.dest,status:'pago',date:today(),time:'',obs:''})};
const setL=()=>{const v=parse($('#lv').value);if(v==null)return;S.lim[$('#lc').value]=v;save();draw()};
const delL=c=>{delete S.lim[c];save();draw()};
const setM=()=>{const v=parse($('#mv').value);if(v==null)return;S.metas[$('#mc').value]=v;save();draw()};
const limH=()=>{const u={};stats().ev.forEach(t=>u[t.cat]=(u[t.cat]||0)+t.cents);return`<div class='card'><h2>Limites por categoria</h2>${Object.entries(S.lim).map(([c,l])=>{const x=u[c]||0,p=x/l*100;return`<div class='cb'><b>${esc(c)}</b><div class='bar'><i style='width:${Math.min(100,p)}%;background:${p>=100?'var(--er)':p>=90?'var(--wn)':'var(--ok)'}'></i></div><span>${R(x)} de ${R(l)} · ${p>=100?'passou '+R(x-l):p>=90?'quase no limite':'resta '+R(l-x)}</span><button class='s' onclick='delL(${JSON.stringify(c)})'>Remover</button></div>`}).join('')||`<p class='m'>Nenhum limite definido. Defina se quiser; nada é ativado sozinho.</p>`}<select id='lc'>${opt(CATS,'')}</select><input id='lv' inputmode='decimal' placeholder='Limite do mês (R$)'><button class='p' onclick='setL()'>Definir limite</button></div>`};
const FX=[],OLDFX=['Barbeiro','Spotify / Netflix','Internet','Parcelamento SHEIN'];
const DAY=864e5,iso=t=>new Date(t).toISOString().slice(0,10),diff=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/DAY);
const easter=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return Date.UTC(y,Math.floor((h+l-7*m+114)/31)-1,(h+l-7*m+114)%31+1)};
const hol=y=>{const e=easter(y),s=new Set(['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].map(x=>y+'-'+x));[-48,-47,-2,60].forEach(d=>s.add(iso(e+d*DAY)));return s};
const bd5=(y,m)=>{const H=hol(y);let n=0;for(let t=Date.UTC(y,m-1,1);;t+=DAY){const w=new Date(t).getUTCDay();if(w==0||(w==6&&!S.sat)||H.has(iso(t)))continue;if(++n==5)return iso(t)}};
const nextPay=()=>{const t=today();let y=+t.slice(0,4),m=+t.slice(5,7),d=bd5(y,m);if(d<t){m++;if(m>12){m=1;y++}d=bd5(y,m)}return d};
const saveSal=()=>{const c=parse($('#sv').value);if(c!=null){S.salary=c;save();draw()}};
const payH=()=>{const d=nextPay(),n=diff(d,today()),s=stats(),sal=S.salary||0,w=new Date(d+'T12:00:00Z').toLocaleDateString('pt-BR',{weekday:'long',timeZone:'UTC'});return`<div class='card'><h2>Próximo salário</h2><div class='big'>${n==0?'É hoje!':n==1?'Falta 1 dia':'Faltam '+n+' dias'}</div><p>${d.split('-').reverse().join('/')} (${w}), 5º dia útil. Previsão: <b>${sal?R(sal):'não informada (ajuste abaixo)'}</b></p>${n>0&&s.rest>0&&S.month==today().slice(0,7)?`<p class='m'>Até lá, restam ${R(s.rest)} do orçamento do mês: cerca de ${R(Math.floor(s.rest/n))} por dia.</p>`:''}<details><summary class='m'>Ajustar previsão</summary><input id='sv' inputmode='decimal' placeholder='Valor do salário' value='${fmtIn(sal||null)}'><label class='cb'><input type='checkbox' style='width:auto;min-height:auto' ${S.sat?'checked':''} onchange='S.sat=this.checked;save();draw()'> Contar sábado como dia útil</label><button class='s' onclick='saveSal()'>Salvar valor</button><p class='m'>Informe o valor aproximado do seu salário. Em meses com abono, corrija quando souber o valor exato. Consideramos feriados nacionais e dias sem expediente bancário (Carnaval, Sexta-feira Santa, Corpus Christi). Feriados locais não entram.</p></details></div>`};
const insH=()=>{const s=stats(),L=[];if(s.ev.length){const m=s.ev.reduce((a,b)=>b.cents>a.cents?b:a);L.push(`Maior gasto: ${esc(m.desc)} (${R(m.cents)}).`);const by={};s.ev.filter(t=>t.cat!='Não categorizado').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.cents);const e=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];if(e)L.push(`Categoria que mais pesa: ${esc(e[0])} (${pc(e[1]/s.v*100)} dos gastos).`);L.push(`Média por compra: ${R(Math.round(s.v/s.ev.length))}.`)}const t=today(),dp=+t.slice(8);if(t.slice(0,7)==S.month&&s.v){const dm=new Date(+t.slice(0,4),+t.slice(5,7),0).getDate();L.push(`Ritmo atual (estimativa): ${R(Math.round(s.v/dp*dm))} no mês, contra o orçamento de ${R(S.budget)}.`)}const fx=S.fixed.filter(f=>f.c&&!s.ef.some(x=>x.desc==f.n)).reduce((a,f)=>a+f.c,0);if(fx)L.push(`Fixos ainda a pagar: ${R(fx)}.`);S.cards.forEach(c=>{const f=fatura(c);if(f)L.push(`Fatura em aberto do ${esc(c.n)}: ${R(f)}.`)});return L.length?`<div class='card'><h2>Curiosidades do mês</h2>${L.map(x=>`<p>• ${x}</p>`).join('')}</div>`:''};
const svd=g=>S.tx.filter(t=>t.type=='inv'&&t.cat=='Meta: '+g.n).reduce((s,t)=>s+t.cents,0);
const pays=t=>{let n=0,x=nextPay(),y=+x.slice(0,4),m=+x.slice(5,7);while(x<=t&&n<60){n++;m++;if(m>12){m=1;y++}x=bd5(y,m)}return n};
const need=g=>{const r=Math.max(0,g.t-svd(g)),n=pays(g.d);return n?Math.ceil(r/n):r};
const aport=i=>{const g=S.goals[i];openForm(null,'inv',{desc:'Aporte: '+g.n,type:'inv',cat:'Meta: '+g.n,cents:need(g)||undefined,method:'t'})};
const finG=i=>{const g=S.goals[i];g.done=1;save();draw();openForm(null,'exp',{desc:g.n,type:'exp',kind:'obj',cat:'Presentes',cents:svd(g)||undefined})};

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

${al.length?`<div class="card warn"><h2>Para conferir</h2>${al.map(a=>`<p>${a}</p>`).join('')}</div>`:''}

function saveF(id,again){const[ty,kd]=$('#f_t').value.split(':'),c=parse($('#f_v').value),d=$('#f_d').value.trim(),dt=$('#f_dt').value,old=id&&S.tx.find(x=>x.id==id),e=m=>$('#fe').textContent=m;
if(!c||c<=0)return e('Informe um valor maior que zero, como 12,50.');if(!d)return e('Informe a descrição.');if(!dt&&!(old&&!old.date))return e('Informe a data.');
if(/^(tr|fat)$/.test(ty)&&(!$('#f_a').value||!$('#f_ds').value))return e('Escolha a origem e o destino.');const n={id:id||'t'+Date.now(),type:ty,kind:kd||undefined,desc:d,cents:c,date:dt||null,month:old?old.month:S.month,time:$('#f_h').value,cat:$('#f_c').value,sugg:false,method:$('#f_m').value,status:$('#f_s').value,obs:$('#f_o').value,acc:$('#f_a').value,dest:$('#f_ds').value,created:old?old.created:new Date().toISOString(),updated:new Date().toISOString()};
if(!id&&S.tx.some(x=>x.desc==d&&x.cents==c&&x.date==dt&&x.method==n.method)&&!confirm('Já existe um lançamento igual (mesma descrição, valor, data e método). Salvar mesmo assim?'))return;
if(id)S.tx=S.tx.map(x=>x.id==id?n:x);else S.tx.push(n);if(dt)S.month=dt.slice(0,7);save();closeF();flash('Lançamento salvo.');draw();if(again)openForm()}
const TABS=[['home','Início'],['tx','Lançamentos'],['+',''],['rep','Relatórios'],['ai','Assistente']];
const tst=()=>{document.querySelectorAll('.toast').forEach(x=>x.remove());if(toast)$('#nav').insertAdjacentHTML('beforebegin',`<div class="toast" role="status"><span>${toast.m}</span>${toast.undo?'<button onclick="toast.undo()">Desfazer</button>':''}</div>`)};
function draw(keep){mig();const f=document.activeElement,id=f&&f.id,ss=f&&f.selectionStart;
const V={home,tx:list,rep:reports,ai:assistant,more}[tab],ti={home:'Início',tx:'Lançamentos',rep:'Relatórios',ai:'Assistente',more:'Mais'}[tab];
$('#app').innerHTML=`<header><h1>Meu Controle Financeiro</h1><div style="white-space:nowrap"><button class="s" onclick="S.hide=!S.hide;save();draw()" aria-label="Ocultar ou mostrar valores">${S.hide?'Mostrar':'Ocultar'}</button> <button class="s" onclick="tab='more';draw()">Mais</button></div></header><div class="row" style="margin-bottom:10px"><button class="s" onclick="shift(-1)" aria-label="Mês anterior">‹</button><b class="mn">${monthName(S.month)}</b><button class="s" onclick="shift(1)" aria-label="Próximo mês">›</button></div>${err?`<div class="card warn">${err}</div>`:''}${V()}`;
$('#nav').innerHTML=TABS.map(([k,l])=>k=='+'?`<button class="plus" onclick="openForm()" aria-label="Adicionar lançamento">+</button>`:`<button class="${tab==k?'on':''}" onclick="tab='${k}';draw();scrollTo(0,0)">${l}</button>`).join('');
tst();
if(keep&&id){const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(ss,ss)}catch(e){}}}}
draw();cloud();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script></body></html>
